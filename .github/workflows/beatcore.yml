name: BeatCore Verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beatone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beatone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: node --import tsx --test test/payments-postgres-runtime.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beatone_test


  event-evidence-postgres-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beatone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beatone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: node --import tsx --test test/event-evidence-postgres-runtime.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beatone_test

  beatcore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
